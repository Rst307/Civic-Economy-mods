modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Civic Economy contributors"
description='''
Civic Economy fiscal and monetary infrastructure.
'''

[[mixins]]
config="civiceconomy.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="lightmanscurrency"
type="required"
versionRange="[${lightmans_currency_version}]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ftbteams"
type="required"
versionRange="[${ftb_teams_version}]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ftbchunks"
type="required"
versionRange="[${ftb_chunks_version}]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
