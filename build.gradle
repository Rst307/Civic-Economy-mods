plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev' }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = project.file(providers.gradleProperty('includeCreate')
                    .map(String::toBoolean)
                    .getOrElse(false) ? 'run-server-create' : 'run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    testRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    jarJar(implementation("org.xerial:sqlite-jdbc:${sqlite_jdbc_version}")) {
        version {
            strictly "[${sqlite_jdbc_version}]"
            prefer sqlite_jdbc_version
        }
    }
    additionalRuntimeClasspath "org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"

    compileOnly "maven.modrinth:lightmans-currency:${lightmans_currency_version}"
    localRuntime "maven.modrinth:lightmans-currency:${lightmans_currency_version}"
    localRuntime "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    localRuntime "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    localRuntime "dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}"

    if (providers.gradleProperty('includeCreate').map(String::toBoolean).getOrElse(false)) {
        localRuntime "maven.modrinth:create:${create_version}"
    }

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'civic.test.createExpected',
            providers.gradleProperty('includeCreate').map(String::toBoolean).getOrElse(false)
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

tasks.register('resolveRuntimeDependencies') {
    def runtimeDependencies = configurations.localRuntime
    inputs.files(runtimeDependencies)
    doLast {
        runtimeDependencies.files.each { println it }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version          : minecraft_version,
            minecraft_version_range    : minecraft_version_range,
            neo_version                : neo_version,
            loader_version_range       : loader_version_range,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : mod_version,
            lightmans_currency_version : lightmans_currency_version,
            ftb_teams_version          : ftb_teams_version,
            ftb_chunks_version         : ftb_chunks_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

var generateGameTestStructures = tasks.register('generateGameTestStructures') {
    inputs.file layout.projectDirectory.file('src/main/gametest/empty.nbt.b64')
    outputs.file layout.buildDirectory.file('generated/gametestResources/data/civiceconomy/structure/empty.nbt')
    doLast {
        def outputFile = outputs.files.singleFile
        outputFile.parentFile.mkdirs()
        outputFile.bytes = Base64.decoder.decode(inputs.files.singleFile.text.trim())
    }
}

sourceSets.main.resources.srcDir generateModMetadata
sourceSets.main.resources.srcDir layout.buildDirectory.dir('generated/gametestResources')
tasks.named('processResources').configure { dependsOn generateGameTestStructures }
neoForge.ideSyncTask generateModMetadata
neoForge.ideSyncTask generateGameTestStructures

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
